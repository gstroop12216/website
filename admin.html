<!doctype html><html lang="en"><head><link rel="icon" href="gs-logo.png" type="image/png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Admin - Troop 12216</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><header><a class="brand" href="index.html"><b>GS</b> Troop <strong>12216</strong></a><nav><a href="events.html" target="_blank">Open public calendar</a></nav></header><main class="editor-shell"><section id="login" class="login-card"><p class="eyebrow">Private area</p><h1>Welcome back</h1><p>Sign in to update the troop calendar.</p><form id="lf" class="login-form"><div class="login-field"><label for="login-username">Username</label><input id="login-username" name="username" autocomplete="username" required></div><div class="login-field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Sign in</button><p id="msg" class="form-message" role="alert"></p></form></section><section id="admin" hidden><div class="admin-topbar"><div><p class="eyebrow">Calendar manager</p><h1>Events</h1></div><div class="top-actions"><span id="count"></span><button class="icon-button" id="logout" title="Sign out">? <span>Sign out</span></button></div></div><div class="editor-layout"><aside class="event-sidebar"><button id="new-event" class="new-event">+ New event</button><div id="events" class="event-nav"></div></aside><section class="inline-editor"><div class="editor-title"><div><p id="editor-kicker" class="eyebrow">New event</p><h2 id="heading">Add a calendar event</h2></div><button id="preview" class="preview-button" type="button">Preview</button></div><form id="ef"><input id="id" type="hidden"><div class="field-grid"><label>Date<input id="date" type="datetime-local" required></label><label>Event title<input id="title" required placeholder="e.g. Troop Meeting"></label></div><label>Details<textarea id="details" rows="6" placeholder="Location, what to bring, helpful notes..."></textarea></label><div class="resource-grid"><div><div class="section-label">Link</div><label class="sub-label">Label<input id="label" placeholder="Event information"></label><label class="sub-label">URL<input id="url" type="url" placeholder="https://"></label></div><div><div class="section-label">Attachment</div><input id="attachment" type="hidden"><div id="drop-zone" class="drop-zone" tabindex="0"><input id="file-input" type="file" hidden><span class="upload-icon">?</span><strong>Drop a file here</strong><span>or <button id="browse-file" type="button">browse files</button></span></div><div id="uploaded-file" class="uploaded-file" hidden></div><p class="hint">PDF, image, or document - max 10 MB</p></div></div><div class="editor-footer"><p id="status" class="save-status"></p><div><button id="delete" type="button" class="delete-button" hidden>Delete</button><button id="cancel" type="button" class="cancel-button">Discard</button><button class="button" type="submit">Save event</button></div></div></form></section></div></section></main><dialog id="dialog" class="preview-dialog"><button class="dialog-close" onclick="dialog.close()">Close</button><p class="eyebrow">Public event preview</p><div id="previewBox"></div></dialog><script src="admin.js"></script></body></html>
